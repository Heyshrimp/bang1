<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BANG! Duel — 1대1 프로토타입</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#171a20;--panel:#242a33;--panel2:#303845;--gold:#e8b85c;--red:#d85a50;--green:#68b58a;--muted:#aab3c0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#303947,#171a20 65%);color:#f3f1e9;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
main{max-width:1050px;margin:auto;padding:22px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;color:var(--gold);letter-spacing:2px;font-size:clamp(27px,5vw,42px)}.sub{color:var(--muted);font-size:13px}
.panel{background:rgba(36,42,51,.94);border:1px solid #414b59;border-radius:15px;padding:16px;margin:14px 0;box-shadow:0 8px 25px #0003}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}
button,input{font:inherit;border-radius:9px;border:1px solid #596575;padding:10px 13px}button{background:#465366;color:white;cursor:pointer;font-weight:650}button:hover{filter:brightness(1.15)}button:disabled{opacity:.4;cursor:not-allowed}
button.primary{background:var(--gold);color:#211b10;border-color:var(--gold)}button.danger{background:#8d3937}button.good{background:#286347}input{background:#171c23;color:white;min-width:150px}
.status{color:var(--muted);font-size:13px;margin-top:8px;min-height:18px}.hidden{display:none!important}
.arena{display:grid;grid-template-columns:1fr 1fr;gap:12px}.player{background:#1b2028;border:1px solid #424d5c;border-radius:12px;padding:14px;min-height:126px}.player.active{border:2px solid var(--gold);box-shadow:0 0 0 2px #e8b85c22}
.player h2{font-size:17px;margin:0 0 8px}.hearts{font-size:22px;letter-spacing:3px;color:#f07870}.meta{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.section-title{font-size:14px;color:var(--gold);font-weight:750;margin-bottom:10px}
.hand{display:flex;flex-wrap:wrap;gap:9px}.card{width:130px;min-height:116px;text-align:left;background:linear-gradient(145deg,#f5ead0,#d9c9a8);color:#28251f;border:2px solid #fff8e9;border-radius:11px;padding:10px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 4px 8px #0004}
.card strong{font-size:16px}.card small{font-size:11px;line-height:1.3}.card .symbol{font-size:25px;align-self:flex-end}.card:disabled{opacity:.55;filter:grayscale(.7)}.card.selected{outline:3px solid var(--gold);transform:translateY(-3px);box-shadow:0 0 0 3px #e8b85c33}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.log{height:145px;overflow:auto;background:#151a20;border-radius:9px;padding:10px;font-size:13px;color:#cbd2dc}.log div{padding:3px 0;border-bottom:1px solid #ffffff0c}
.badge{display:inline-block;background:#3b4655;border-radius:20px;padding:4px 9px;font-size:12px;color:#dfe5ec}
footer{color:#8893a2;font-size:11px;text-align:center;margin:22px 0}
@media(max-width:600px){main{padding:13px}.arena{grid-template-columns:1fr}.card{width:calc(50% - 5px);min-height:105px}}
</style>
</head>
<body>
<main>
<header><div><h1>BANG! DUEL</h1><div class="sub">1대1 카드 대전 · 팬 제작 프로토타입</div></div><span class="badge" id="modeBadge">연결 대기</span></header>

<section class="panel" id="lobby">
 <div class="section-title">게임 시작</div>
 <div class="row">
  <button class="primary" id="aiBtn">노말 AI</button>
  <button id="hardAiBtn">하드 AI</button>
  <button id="hostBtn">온라인 방 만들기</button>
  <input id="peerCode" placeholder="친구의 방 코드">
  <button id="joinBtn">방 참가</button>
 </div>
 <div class="status" id="netStatus">AI 대전 또는 온라인 대전을 선택하세요. 온라인은 두 사람 모두 이 페이지를 열어야 합니다.</div>
 <div class="row hidden" id="hostInfo"><span>내 방 코드:</span><strong id="myCode" style="color:var(--gold);letter-spacing:1px"></strong><button id="copyCode">코드 복사</button></div>
</section>

<section class="panel hidden" id="game">
 <div class="row" style="justify-content:space-between;margin-bottom:12px"><div class="section-title" style="margin:0">대전 현황</div><span class="badge" id="turnLabel">내 턴</span></div>
 <div class="arena">
  <div class="player" id="p1"><h2 id="name1">나</h2><div class="hearts" id="hp1">♥ ♥ ♥ ♥</div><div class="meta" id="meta1">손패 0장</div></div>
  <div class="player" id="p2"><h2 id="name2">상대</h2><div class="hearts" id="hp2">♥ ♥ ♥ ♥</div><div class="meta" id="meta2">손패 0장</div></div>
 </div>
 <div class="panel" style="background:#202630;margin:12px 0">
  <div class="row" style="justify-content:space-between"><div class="section-title" id="handTitle" style="margin:0">내 손패</div><span class="badge" id="deckCount">덱 0장</span></div>
  <div class="hand" id="hand"></div>
  <div class="actions" id="actions"></div>
  <div class="status" id="hint"></div>
 </div>
 <div class="section-title">게임 기록</div><div class="log" id="log"></div>
 <div class="actions"><button class="danger" id="newGame">로비로 돌아가기</button></div>
</section>
<footer>이 버전은 원작 규칙을 그대로 재현한 것이 아닌, 1대1 테스트를 위한 간소화된 팬 프로토타입입니다. PeerJS 연결에는 인터넷이 필요합니다.</footer>
</main>
<script>
(() => {
const $=id=>document.getElementById(id);
const SUITS=["♥","♦","♣","♠"];
const CARD={chain:{name:"타인의 사슬",symbol:"⛓",desc:"상대 턴 시작 하트면 해제 · 상대 카드 사용 2장 제한"},mark_sealed:{name:"표지(봉인)",symbol:"▣",desc:"상대 뱅에 하트면 회피 · 실패 시 손패 2장으로 방어 (손패 2장 이상 필요)"},mark_open:{name:"표지(개화)",symbol:"▣",desc:"하트/다이아면 회피 · 실패 시 손패 1장으로 방어"},arayaseki_sealed:{name:"아라야시키(봉인)",symbol:"刀",desc:"봉인해제 2회 후 개화"},arayaseki:{name:"아라야시키",symbol:"刀",desc:"천살: 적중 시 최대 체력 감소 및 손패 버림"},feast:{name:"포식",symbol:"🍴",desc:"판정 후 피해 1 및 상대 손패 버림 · 턴당 3회"},breed:{name:"번식",symbol:"🌱",desc:"맥주 대신 사용 · 체력 1 회복 및 최대 체력 1 증가"},march:{name:"행진",symbol:"⚑",desc:"빗나감 대신 사용 · 다음 턴 드로우 +1"},bang:{name:"뱅!",symbol:"✦",desc:"상대 공격 · 턴당 1회"},miss:{name:"빗나감!",symbol:"〰",desc:"뱅!을 방어"},beer:{name:"맥주",symbol:"♥",desc:"내 체력 1 회복"},draw:{name:"전략",symbol:"✚",desc:"카드 2장 드로우"},repair:{name:"정비",symbol:"⚙",desc:"카드 3장 드로우"},duel:{name:"결투",symbol:"⚔",desc:"상대와 뱅!을 번갈아 냄"},indians:{name:"인디언",symbol:"🏹",desc:"상대가 뱅!을 내지 못하면 피해 1"},saloon:{name:"선술",symbol:"🍺",desc:"나 2 회복 · 상대 1 회복"},cat:{name:"캣벌로우",symbol:"🐈",desc:"상대 손패 또는 장비 1장 버리기"},steal:{name:"강탈",symbol:"✋",desc:"상대 손패 또는 장비 1장 가져오기"},barrel:{name:"술통",symbol:"🛢",desc:"뱅!을 맞으면 하트 판정으로 회피"},vest:{name:"방탄조끼",symbol:"🦺",desc:"상대 턴 첫 뱅! 방어 · 내구도 3"},scope:{name:"정조준",symbol:"◎",desc:"뱅!에 카드 1장을 더 버려 장비 무시"},jail:{name:"감옥",symbol:"🔒",desc:"상대 턴 시작 때 하트가 아니면 턴 건너뜀 · 내구도 3"},dynamite:{name:"다이너마이트",symbol:"💣",desc:"턴 시작 때 스페이드면 피해 2, 아니면 전달"},volcanic:{name:"볼캐닉",symbol:"🔫",desc:"뱅! 사용 횟수 제한 해제"},sniper:{name:"로직 아틀리에제 저격총",symbol:"🎯",desc:"뱅! 때 스페이드 판정 성공 시 방어 장비 무시 · 정조준 장착 시 판정/추가 소모 없이 방어 무시"},guild:{name:"시협회 제식 장비",symbol:"⚔",desc:"뱅! 적중 시 스페이드 판정으로 피해 2배"},notebook:{name:"디에치 협회 암기노트",symbol:"📘",desc:"뱅! 적중 시 카드 1장 드로우"},gloves:{name:"리우협회 불꽃장갑",symbol:"🔥",desc:"뱅!이 빗나감에 막히면 상대 손패 1장 버림"}};
const CHAR={yi:{name:"이상",hp:4,desc:"턴 시작 3장 중 2장 선택 · 손패가 0장이 되면 턴당 2회까지 1장 드로우"},faust:{name:"파우스트",hp:4,desc:"상대 손패 열람 · 턴 시작 스페이드 판정 시 1장 추가 드로우"},don:{name:"돈키호테",hp:4,desc:"뱅 적중 시 출혈 · 상대 턴 종료 때 출혈 판정"},ryo:{name:"료슈",hp:3,desc:"봉인해제 2회 후 아라야시키 · 천살 적중 시 최대 체력 감소"},meur:{name:"뫼르소",hp:4,desc:"감옥 대신 타인의 사슬 · 상대는 턴당 카드 2장 제한"},hong:{name:"홍루",hp:3,desc:"기본 술통 보유 · 회피 성공 시 상대 손패 버림"},heath:{name:"히스클리프",hp:3,desc:"뱅 제한 없음 · 초과 손패를 가사 상태로 보관"},ish:{name:"이스마엘",hp:4,desc:"작살갈기 후 다음 뱅 피해 2 · 다음 턴 드로우 +1 · 특정 판정이면 방어 장비 무시"},ro:{name:"로쟈",hp:4,desc:"턴당 1회 손패 전부 버리고 버린 수+1장 드로우 · 강탈 제한 없음"},sin:{name:"싱클레어",hp:3,desc:"표지 봉인/개화로 뱅 방어 · 술통/방탄조끼 장착 불가"},otis:{name:"오티스",hp:4,desc:"뱅으로도 방어 가능 · 상대 턴당 1회 드로우"},greg:{name:"그레고르",hp:3,desc:"턴 시작 3장 드로우 · 맥주 4회 사용 시 바퀴황제"},wheel:{name:"바퀴황제",hp:4,desc:"턴 시작 4장 · 포식/번식/행진 · 최대 체력 6"}};
let mode="none",peer=null,conn=null,isHost=false,localIndex=0,state=null,aiTimer=null,selectedDiscards=new Set(),aimedMode=false,aiDifficulty="normal";
const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function card(id){return {id,suit:SUITS[Math.floor(Math.random()*4)],uid:Math.random().toString(36).slice(2)}}
function makeDeck(){let counts={bang:22,miss:16,beer:8,draw:7,repair:5,duel:5,indians:5,saloon:4,cat:6,steal:5,barrel:2,vest:2,scope:2,jail:3,dynamite:2,volcanic:1,sniper:1,guild:1,notebook:1,gloves:1};let d=[];for(let [id,n] of Object.entries(counts))for(let i=0;i<n;i++)d.push(card(id));return shuffle(d)}
function uniformOffers(ids){return shuffle(ids.slice()).slice(0,4)}
function freshState(names=["나","상대"]){let ids=Object.keys(CHAR).filter(id=>id!=="wheel");let players=[0,1].map(i=>({name:names[i],hp:4,maxHp:4,hand:[],equip:[],weapon:null,attached:[],character:null,offers:uniformOffers(ids),bleed:0,sealCount:0,markStage:0,markUses:0,markUsed:false,markDrawBonus:0,dormant:[],harpoon:false,harpoonDrawBonus:0,beerUses:0,roUsed:false,feastUsed:0,marchBonus:0,emptyDraws:0,emptyDrawTurn:0,chainUsed:0}));return {players,deck:makeDeck(),discard:[],turn:0,turnNo:0,bangs:0,pending:null,discarding:false,over:false,log:[],skipStart:false,scopePrompt:null,abilityPrompt:null,indiansUsed:false,phase:"select",idealChoice:null}}
function log(s,t){s.log.unshift(t);s.log=s.log.slice(0,60)}
function initChosen(s){for(let p of s.players){let c=CHAR[p.character];p.maxHp=c.hp;p.hp=c.hp;if(p.character==="ryo")p.weapon={id:"arayaseki_sealed",suit:"",uid:"ryo"};if(p.character==="sin")p.equip=[{id:"mark_sealed",suit:"",uid:"sin"}];if(p.character==="wheel")p.hand.forEach(h=>h.id=["feast","breed","march"][Math.floor(Math.random()*3)])}s.phase="play";for(let p of s.players)draw(s,p,p.maxHp);log(s,"캐릭터 선택 완료! "+s.players[0].name+"의 턴입니다.");startTurn(s)}
function chooseCharacter(s,actor,id){let p=s.players[actor];if(s.phase!=="select"||p.character||!p.offers.includes(id))return false;p.character=id;log(s,p.name+"이(가) "+CHAR[id].name+"을(를) 선택했습니다.");if(s.players.every(x=>x.character))initChosen(s);return true}
function characterName(p){return p.character?CHAR[p.character].name:"선택 중"}
function isBangCard(p,id){return id==="bang"&&(p.character!=="ryo"||p.sealCount>=2)}
function handBecameEmpty(s,p){if(p.character!=="yi"||p.hand.length!==0)return;if(p.emptyDrawTurn!==s.turnNo){p.emptyDrawTurn=s.turnNo;p.emptyDraws=0}if(p.emptyDraws<2){p.emptyDraws++;draw(s,p,1);log(s,"이상 효과: 손패가 비어 카드 1장을 뽑았습니다. ("+p.emptyDraws+"/2)")}}
function draw(s,p,n){for(let i=0;i<n;i++){if(!s.deck.length){s.deck=shuffle(s.discard);s.discard=[];if(!s.deck.length)break}let pick=s.deck.length-1;if(mode==="ai"&&aiDifficulty==="hard"&&p===s.players[1]){let total=0;for(const c of s.deck)total+=(c.id==="draw"||c.id==="repair")?1.5:1;let roll=Math.random()*total;for(let j=0;j<s.deck.length;j++){roll-=(s.deck[j].id==="draw"||s.deck[j].id==="repair")?1.5:1;if(roll<0){pick=j;break}}}let c=s.deck.splice(pick,1)[0];if(p.character==="wheel")c.id=["feast","breed","march"][Math.floor(Math.random()*3)];p.hand.push(c)}}
function transformWheel(s,p){if(p.character!=="greg")return;p.character="wheel";p.maxHp=4;p.hp=Math.min(p.maxHp,p.hp);if(p.weapon){s.discard.push(p.weapon);p.weapon=null}while(p.equip.length)discardEquip(s,p,p.equip.length-1);for(let z=p.hand.length-1;z>=0;z--){if(["volcanic","sniper","guild","notebook","gloves"].includes(p.hand[z].id))discard(s,p,z);else p.hand[z].id=["feast","breed","march"][Math.floor(Math.random()*3)]}log(s,"그레고르가 바퀴황제로 변했습니다! 무기와 모든 장비를 버렸습니다.")}
function discard(s,p,i){let c=p.hand.splice(i,1)[0];if(c){delete c.dormantUntil;s.discard.push(c)}return c}
function activeHandCount(p){return p.hand.filter(c=>!c.dormantUntil).length}
function discardEquip(s,p,i){let c=p.equip.splice(i,1)[0];if(c)s.discard.push(c);return c}
function judgment(s){if(!s.deck.length){s.deck=shuffle(s.discard);s.discard=[]}return s.deck.pop()||card("miss")}
function suitName(c){return c.suit}
function damage(s,target,n=1){let p=s.players[target],before=p.hp;p.hp=Math.max(0,p.hp-n);log(s,p.name+" 피해 "+n+"을(를) 받았습니다.");if(before>0&&p.hp<=0){let bi=p.hand.findIndex(c=>c.id==="beer");if(bi>=0){discard(s,p,bi);p.hp=1;if(p.character==="greg"){p.beerUses++;if(p.beerUses>=4)transformWheel(s,p)}if(p.bleed>0)p.bleed--;log(s,p.name+"은(는) 탈락 직전 맥주를 사용해 체력 1로 살아남았습니다!")}else{s.over=true;log(s,s.players[1-target].name+" 승리!")}} }
function equipIndex(p,id){return p.equip.findIndex(c=>c.id===id)}
function protectedSpecial(c){return !!c&&(["mark_sealed","mark_open","arayaseki_sealed","arayaseki"].includes(c.id)||c.uid==="sin"||c.uid==="ryo")}
function removableEquipIndices(p){return p.equip.map((c,i)=>({c,i})).filter(x=>!protectedSpecial(x.c)).map(x=>x.i)}
function equipmentLabel(c){return CARD[c.id].name+(c.id==="vest"||c.id==="jail"?" (내구도 "+(c.durability??3)+")":"")}
function startTurn(s){if(s.over)return;let p=s.players[s.turn],op=s.players[1-s.turn];s.bangs=0;s.indiansUsed=false;s.scopePrompt=null;s.skipStart=false;p.usedCards={};p.markUsed=false;p.chainUsed=0;p.chainLimit=0;p.emptyDraws=0;p.emptyDrawTurn=-1;
 // 턴 시작 판정 순서 고정: 다이너마이트 → 감옥
 // 먼저 다이너마이트를 처리하고, 감옥 때문에 턴이 스킵되더라도 판정은 이미 끝난 상태다.
 let di=p.attached.findIndex(c=>c.id==="dynamite");
 if(di>=0){let d=p.attached[di],j=judgment(s);log(s,p.name+"의 다이너마이트 판정: "+j.suit);s.discard.push(j);p.attached.splice(di,1);if(j.suit==="♠"){s.discard.push(d);damage(s,s.turn,2);if(s.over)return;}else{op.attached.push(d);log(s,"다이너마이트가 "+op.name+"에게 넘어갔습니다.")}}
 // 감옥과 타인의 사슬은 각각 최대 1개씩 독립적으로 판정한다.

 $("hint").textContent=state.over?(me.hp>0?"승리했습니다!":"패배했습니다."):state.heathDormantSelecting?(state.turn===localIndex?`초과한 카드 중 ${state.heathDormantNeed}장을 선택해 다음 턴까지 가사 상태로 보존하세요.`:"상대가 가사 카드를 지정하고 있습니다."):state.discarding?(state.turn===localIndex?`손패를 체력(${me.hp})과 같은 장수로 맞추세요.`:"상대가 손패를 정리하고 있습니다."):me.chainLimit>0&&me.chainUsed>=me.chainLimit&&state.turn===localIndex?"타인의 사슬 효과로 이번 턴 카드 2장을 모두 사용했습니다.":ap?(ap.actor!==localIndex?"상대가 캐릭터 능력 사용 방식을 선택하고 있습니다.":"카드 사용 방식을 선택하세요."):sp?(sp.actor!==localIndex?"상대가 정조준 여부를 선택하고 있습니다.":sp.mode==="select"?"정조준에 추가로 소모할 손패 아무 카드나 선택하세요.":"정조준을 발동하거나 일반 공격을 선택하세요."):q?(q.target===localIndex?"상대 카드에 대응하세요.":"상대의 대응을 기다리는 중입니다."):state.turn===localIndex?"카드를 선택해 사용하거나 턴을 종료하세요.":"상대의 행동을 기다리는 중입니다.";$("log").innerHTML=state.log.map(x=>`<div>${escapeHtml(x)}</div>`).join("")
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function sendAction(a){if(mode==="online"&&!isHost){if(conn&&conn.open)conn.send({type:"action",action:a});if(a.type==="discard"||a.type==="heathDormant")selectedDiscards.clear();return}processAction(localIndex,a)}
function maybeAI(){
 if(mode!=="ai"||!state||state.over)return;
 clearTimeout(aiTimer);
 const ai=state.players[1],human=state.players[0];
 const wait=(fn,ms=420)=>{aiTimer=setTimeout(fn,ms)};
 const idx=(who,id)=>who.hand.findIndex(c=>c.id===id&&!c.dormantUntil);
 const has=(who,id)=>idx(who,id)>=0;
 const used=ai.usedCards||{};
 const cardScore=id=>({bang:10,miss:9,beer:9,repair:8,draw:8,duel:6,indians:7,saloon:8,cat:7,steal:9,barrel:10,vest:9,scope:8,jail:9,dynamite:8,volcanic:10,sniper:9,guild:10,notebook:8,gloves:7,feast:10,breed:9,march:8})[id]||1;
 const discardIndex=who=>{
  let candidates=who.hand.map((c,i)=>({c,i})).filter(x=>!x.c.dormantUntil);
  candidates.sort((a,b)=>cardScore(a.c.id)-cardScore(b.c.id));
  return candidates[0]?.i??0;
 };
 if(state.phase==="select"&&!ai.character){
  const id=ai.offers[Math.floor(Math.random()*ai.offers.length)];
  wait(()=>processAction(1,{type:"character",id}),350);return;
 }
 if(state.abilityPrompt&&state.abilityPrompt.actor===1){
  const q=state.abilityPrompt;
  let choice=q.kind==="ryo"?(ai.sealCount<2?"seal":"normal"):q.kind==="ish"?"harpoon":(human.attached.some(c=>c.id==="chain")?"jail":"chain");
  wait(()=>processAction(1,{type:"abilityChoice",choice}));return;
 }
 const sp=state.scopePrompt;
 if(sp&&sp.actor===1){
  wait(()=>{
   if(sp.mode==="choose"||sp.mode==="chooseAfterHarpoon"){
    // 정조준은 방어 장비를 무시할 가치가 있을 때 적극적으로 사용한다.
    const target=state.players[sp.target],hasDefense=target.equip.some(c=>c.id==="barrel"||c.id==="vest")||target.character==="hong"||target.character==="sin";
    if(equipIndex(ai,"scope")>=0&&ai.hand.length>1&&(aiDifficulty==="hard"?(hasDefense||target.hp<=3):(hasDefense||target.hp<=2)))processAction(1,{type:"scopeArm"});
    else processAction(1,{type:"scopeNormal"});
   }else if(sp.mode==="select")processAction(1,{type:"scopePay",index:discardIndex(ai)});
  });return;
 }
 if(sp)return;
 if(state.idealChoice&&state.idealChoice.player===1){const cs=state.idealChoice.cards.map((c,i)=>({i,v:cardScore(c.id)+(c.suit==="♠"?1:0)})).sort((a,b)=>b.v-a.v).slice(0,2).map(x=>x.i);wait(()=>processAction(1,{type:"idealPick",indices:cs}),350);return}
 const q=state.pending;
 if(q&&q.target===1){
  wait(()=>{
   let a;
   if(q.kind==="replaceEquip"||q.kind==="replaceStolenEquip"){
    const protectedIds=ai.character==="sin"?["mark_sealed","mark_open"]:[];
    const candidates=ai.equip.map((e,i)=>({e,i})).filter(x=>!protectedIds.includes(x.e.id));
    if(!candidates.length){state.discard.push(q.newCard);state.pending=null;render();maybeAI();return}
    const equipValue=id=>(aiDifficulty==="hard"&&ai.character==="ish"?{scope:16,barrel:7,vest:6,mark_sealed:20,mark_open:20}:{barrel:10,vest:9,scope:7,mark_sealed:12,mark_open:12})[id]||1;
    candidates.sort((x,y)=>equipValue(x.e.id)-equipValue(y.e.id));
    // 새 장비가 더 가치 있을 때만 교체한다.
    const weakest=candidates[0];
    if(equipValue(q.newCard.id)>equipValue(weakest.e.id))processAction(1,{type:"replaceEquip",index:weakest.i});
    else{state.discard.push(q.newCard);state.pending=null;log(state,"AI는 기존 장비를 유지했습니다.");render();maybeAI()}
    return;
   }
   if(q.kind==="bang"){
    if(ai.character==="wheel"&&has(ai,"march"))a={type:"wheelDodge"};
    else if(aiDifficulty==="hard"&&ai.character==="greg"&&ai.hp>1&&ai.gregorAcceptedHitTurn!==state.turnNo)a={type:"take"};
    else if(ai.character==="sin"&&!ai.markUsed&&ai.hand.length>=(ai.markStage?1:2))a={type:"sinclairDefend"};
    else if(ai.character==="otis"&&has(ai,"bang"))a={type:"otisDefend"};
    else if(has(ai,"miss"))a={type:"defend"};
    else a={type:"take"};
   }else if(q.kind==="duel")a=has(ai,"bang")?{type:"duelBang"}:{type:"duelFail"};
   else if(q.kind==="indians")a=has(ai,"bang")?(ai.character==="otis"?{type:"otisIndianBang"}:{type:"indianBang"}):{type:"indianFail"};
   else a={type:"choose",kind:removableEquipIndices(ai).length?"equip":"hand"};
   processAction(1,a);
  },450);return;
 }
 if(q&&q.attacker===1&&(q.kind==="cat"||q.kind==="steal")){
  wait(()=>processAction(1,{type:"choose",kind:removableEquipIndices(human).length?"equip":"hand"}),400);return;
 }
 if(state.heathDormantSelecting&&state.turn===1){
  wait(()=>{let candidates=ai.hand.map((c,i)=>({c,i})).filter(x=>!x.c.dormantUntil);candidates.sort((a,b)=>cardScore(a.c.id)-cardScore(b.c.id));processAction(1,{type:"heathDormant",indices:candidates.slice(0,state.heathDormantNeed).map(x=>x.i)})},400);return;
 }
 if(state.discarding&&state.turn===1){
  wait(()=>{let candidates=ai.hand.map((c,i)=>({c,i})).filter(x=>!x.c.dormantUntil);candidates.sort((a,b)=>cardScore(a.c.id)-cardScore(b.c.id));let need=state.discardNeed??Math.max(0,activeHandCount(ai)-ai.hp);processAction(1,{type:"discard",indices:candidates.slice(0,need).map(x=>x.i)})},400);return;
 }
 if(state.turn!==1||state.pending||state.discarding)return;
 wait(()=>{
  let a=null;ai.usedCards=ai.usedCards||{};
  const available=id=>idx(ai,id);
  const can=id=>available(id)>=0&&!ai.usedCards[id];
  const canBang=can("bang")&&(state.bangs<1||ai.weapon?.id==="volcanic"||ai.character==="heath");
  const choose=(id)=>({type:"play",index:available(id)});
  if(ai.chainLimit&&ai.chainUsed>=ai.chainLimit){a={type:"end"};processAction(1,a);return}
  // 하드 모드의 캐릭터별 고유 운영
  if(aiDifficulty==="hard"){
   if(ai.character==="ryo"&&canBang&&ai.sealCount<2){a=choose("bang");}
   else if(ai.character==="ish"){
    // 이스마엘은 정조준+시협회 조합을 우선 확보하고 작살갈기로 큰 피해를 노린다.
    if(can("guild")&&ai.weapon?.id!=="guild")a=choose("guild");
    else if(can("scope")&&equipIndex(ai,"scope")<0&&(ai.equip.length<2||ai.equip.every(e=>e.id!=="scope")))a=choose("scope");
    else if(canBang&&human.hp<=3)a=choose("bang");
   }
   else if(ai.character==="sin"){
    // 표지 방어용 패 2장은 최대한 보존한다. 회복/드로우는 계속 허용한다.
    if(ai.hand.filter(c=>!c.dormantUntil).length<=2){
     if(ai.hp<=1&&can("beer"))a=choose("beer");
     else if(ai.hp<=1&&can("saloon"))a=choose("saloon");
     else if(can("repair"))a=choose("repair");
     else if(can("draw"))a=choose("draw");
     else a={type:"end"};
    }
   }
   else if(ai.character==="greg"){
    // 그레고르는 빗나감과 맥주를 아끼고, 한 턴에 한 번 정도 피해를 받아 맥주 4회 사용 변신을 앞당긴다.
    if(ai.hp<ai.maxHp&&can("beer"))a=choose("beer");
    else if(ai.hp<=1&&can("saloon"))a=choose("saloon");
   }
   else if(ai.character==="yi"){
    // 이상은 손패가 얇아지기 전에 드로우를 확보하고, 손패 0장 보너스를 활용한다.
    if(ai.hand.length<=4&&can("repair"))a=choose("repair");
    else if(ai.hand.length<=3&&can("draw"))a=choose("draw");
   }
   else if(ai.character==="faust"){
    // 파우스트는 손패 정보를 바탕으로 상대의 핵심 카드를 빼앗고 드로우 판정 기회를 늘린다.
    if(can("steal")&&human.hand.length>=2)a=choose("steal");
    else if(ai.hand.length<=4&&can("repair"))a=choose("repair");
    else if(ai.hand.length<=4&&can("draw"))a=choose("draw");
   }
   else if(ai.character==="don"){
    // 돈키호테는 출혈을 3중첩까지 쌓는 공격적 운영을 한다.
    if(human.bleed<3&&canBang)a=choose("bang");
    else if(human.bleed<3&&can("duel")&&ai.hand.filter(c=>c.id==="bang").length>=2)a=choose("duel");
   }
   else if(ai.character==="meur"){
    // 뫼르소는 타인의 사슬/감옥으로 상대 턴을 제한하는 데 집중한다.
    if(can("jail")&&!human.attached.some(c=>c.id==="chain"||c.id==="jail"))a=choose("jail");
    else if(can("steal")&&human.hand.length>=1)a=choose("steal");
   }
   else if(ai.character==="hong"){
    // 홍루는 기본 술통 회피를 믿고 공격·방해에 적극적으로 손패를 쓴다.
    if(can("cat")&&(human.weapon||human.equip.length))a=choose("cat");
    else if(canBang)a=choose("bang");
   }
   else if(ai.character==="heath"){
    // 히스클리프는 뱅 제한이 없으므로 공격 기회를 우선하고, 가사로 손패를 보존한다.
    if(canBang)a=choose("bang");
    else if(ai.hand.length<=4&&can("repair"))a=choose("repair");
   }
   else if(ai.character==="otis"){
    // 오티스는 뱅을 방어 자원으로도 쓸 수 있으므로 무기·드로우를 먼저 확보한다.
    if(!ai.weapon&&can("guild"))a=choose("guild");
    else if(!ai.weapon&&can("notebook"))a=choose("notebook");
    else if(ai.hand.length<=4&&can("repair"))a=choose("repair");
   }
   else if(ai.character==="ro"){
    // 로쟈는 강탈로 상대 자원을 빼앗고, 손패가 많고 질이 낮을 때 교체한다.
    if(can("steal")&&(human.weapon||human.equip.length||human.hand.length>=2))a=choose("steal");
    else if(ai.hand.length>=5&&!ai.hand.some(c=>["bang","beer","repair","draw"].includes(c.id))&&!ai.roUsed)a={type:"roSwap"};
   }
   else if(ai.character==="wheel"){
    // 바퀴황제는 최대 체력을 키우고 포식으로 상대 손패까지 압박한다.
    if(can("breed")&&ai.maxHp<6)a=choose("breed");
    else if(can("feast")&&ai.feastUsed<3)a=choose("feast");
   }
  }
  // 생존과 지속 방어를 최우선으로 확보한다.
  if(!a&&ai.hp<=2&&can("beer")&&ai.hp<ai.maxHp)a=choose("beer");
  else if(!a&&ai.hp<=ai.maxHp-2&&can("saloon"))a=choose("saloon");
  else if(!a&&ai.character==="wheel"&&can("breed")&&ai.maxHp<6)a=choose("breed");
  else if(!a&&ai.hp<ai.maxHp&&can("beer"))a=choose("beer");
  // 무기 교체는 현재 무기보다 강한 무기가 있을 때 수행한다.
  else {
   const weaponPower=aiDifficulty==="hard"&&ai.character==="ish"?{guild:16,sniper:8,volcanic:7,notebook:5,gloves:4}:{volcanic:10,guild:10,sniper:9,notebook:8,gloves:7};
   const weaponIds=["volcanic","guild","sniper","notebook","gloves"].filter(id=>can(id)&&ai.character!=="ryo"&&ai.character!=="wheel");
   const bestWeapon=weaponIds.sort((x,y)=>(weaponPower[y]||0)-(weaponPower[x]||0))[0];
   const currentPower=weaponPower[ai.weapon?.id]||0;
   if(bestWeapon&&(!ai.weapon||weaponPower[bestWeapon]>currentPower))a=choose(bestWeapon);
  }
  // 장비 슬롯을 채우고, 더 좋은 방어구가 있으면 약한 장비를 교체한다.
  if(!a){
   const equipPower=aiDifficulty==="hard"&&ai.character==="ish"?{scope:16,barrel:7,vest:6}:{barrel:10,vest:9,scope:8};
   const equipIds=["barrel","vest","scope"].filter(id=>can(id)&&equipIndex(ai,id)<0&&!(ai.character==="sin"&&(id==="barrel"||id==="vest")));
   const best=equipIds.sort((x,y)=>(equipPower[y]||0)-(equipPower[x]||0))[0];
   if(best&&(ai.equip.length<2||equipPower[best]>Math.min(...ai.equip.filter(e=>!(ai.character==="sin"&&["mark_sealed","mark_open"].includes(e.id))).map(e=>equipPower[e.id]||0))))a=choose(best);
  }
  // 드로우 카드는 공격보다 먼저 사용해 선택지를 늘린다.
  if(!a&&can("repair")&&ai.hand.length<=4)a=choose("repair");
  else if(!a&&can("draw")&&ai.hand.length<=5)a=choose("draw");
  // 상대의 장비/턴을 방해한다.
  if(!a&&can("jail")&&!human.attached.some(c=>c.id==="jail"))a=choose("jail");
  else if(!a&&can("dynamite")&&!human.attached.some(c=>c.id==="dynamite"))a=choose("dynamite");
  else if(!a&&can("steal")&&(human.equip.length||human.hand.length))a=choose("steal");
  else if(!a&&can("cat")&&(human.equip.length||human.hand.length))a=choose("cat");
  // 인디언은 상대가 뱅을 보유하지 않았을 때 확정 피해, 결투는 AI의 뱅 우위일 때 사용한다.
  const humanBangCount=human.hand.filter(c=>c.id==="bang").length;
  const aiBangCount=ai.hand.filter(c=>c.id==="bang").length;
  if(!a&&can("indians")&&humanBangCount===0)a=choose("indians");
  else if(!a&&can("duel")&&aiBangCount>=2&&humanBangCount===0)a=choose("duel");
  // 공격을 실행한다.
  if(!a&&canBang)a=choose("bang");
  // 캐릭터 능력 및 남은 회복/드로우를 활용한다.
  if(!a&&ai.character==="ro"&&!ai.roUsed&&ai.hand.length>=4)a={type:"roSwap"};
  if(!a&&ai.character==="wheel"&&can("feast")&&ai.feastUsed<3)a=choose("feast");
  if(!a&&can("saloon")&&ai.hp<ai.maxHp)a=choose("saloon");
  if(!a&&can("repair"))a=choose("repair");
  if(!a&&can("draw"))a=choose("draw");
  if(!a&&can("beer")&&ai.hp<ai.maxHp)a=choose("beer");
  if(!a)a={type:"end"};
  processAction(1,a);
 },520);
}
function startAI(difficulty="normal"){aiDifficulty=difficulty;mode="ai";localIndex=0;isHost=false;state=freshState(["나",difficulty==="hard"?"AI · 하드":"AI · 노말"]);$("modeBadge").textContent=difficulty==="hard"?"하드 AI":"노말 AI";$("netStatus").textContent=(difficulty==="hard"?"하드":"노말")+" AI 대전 중";render()}
